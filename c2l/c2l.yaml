# Default Code2LoRA platform configuration.
# Every field can be overridden by a C2L_* environment variable or by passing
# a different YAML via $C2L_CONFIG. See c2l/config.py for resolution rules.

# Frozen code LLM that the generated adapter plugs into.
base_model: Qwen/Qwen2.5-Coder-1.5B

# Frozen encoder used to embed repo files + commit diffs.
encoder_model: Qwen/Qwen3-Embedding-0.6B

# Linear module types that receive a generated LoRA.
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - up_proj
  - gate_proj
  - down_proj

# Trained GRU + multi-task head checkpoint. Leave ckpt_path empty to pull
# ckpt_file from ckpt_repo on the Hub; set ckpt_path for a fully-local file.
# The multi-task head (num_tasks=2) conditions the adapter on the task, so
# `--task qa` and `--task assert_rhs` produce genuinely different adapters.
ckpt_path:
ckpt_repo: code2lora/c2l-evo-multitask
ckpt_file: gru_head.best.pt

# Tasks enabled in this deployment (registry ids). Empty == all registered.
tasks:
  - assert_rhs
  - qa

# Adapter generation knobs.
max_repo_state_files: 400
walk_fraction: 0.8

# Where exported adapters and registry blobs are written.
adapters_dir: ~/.cache/c2l/adapters

# Force generation device ("cuda" / "cpu"); empty == auto-detect.
device:

# Air-gapped / secure mode: never touch the network (requires local caches).
offline: false
